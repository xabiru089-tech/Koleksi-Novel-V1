<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraStudio — Professional Audio Engine & Suite</title>
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <link href="[https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap](https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar Navigation & Tools -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-wave-square"></i></div>
                <span class="brand-title">AURA ENGINE</span>
            </div>

            <nav class="nav-menu">
                <button class="nav-item active" data-tab="player"><i class="fa-solid fa-compact-disc"></i> Studio Player</button>
                <button class="nav-item" data-tab="eq"><i class="fa-solid fa-sliders"></i> Master Equalizer</button>
                <button class="nav-item" data-tab="spatial"><i class="fa-solid fa-cubes"></i> 3D Spatial Stage</button>
            </nav>

            <!-- Utility Widget: Real-time System Time & BPM Counter -->
            <div class="widget-card">
                <div class="widget-label">STUDIO TIME</div>
                <div class="clock-display" id="clock-display">00:00:00</div>
                <div class="date-display" id="date-display">Senin, 5 Okt 2026</div>
            </div>

            <div class="widget-card">
                <div class="widget-label">SMART BPM ESTIMATOR</div>
                <div class="bpm-value" id="bpm-display">-- BPM</div>
                <div class="bpm-status">Real-time Spectral Analysis</div>
            </div>
        </aside>

        <!-- Main Studio Area -->
        <main class="main-content">
            
            <!-- Top Action Header -->
            <header class="top-bar">
                <div class="file-uploader">
                    <label for="audio-input" class="upload-btn">
                        <i class="fa-solid fa-folder-open"></i> Impor Berkas Audio
                    </label>
                    <input type="file" id="audio-input" accept="audio/*" multiple hidden>
                </div>

                <!-- Unik: Acoustic Ambient Environment Mixer -->
                <div class="ambient-suite">
                    <span class="ambient-title"><i class="fa-solid fa-cloud-rain"></i> Spatial Atmosphere:</span>
                    <button class="ambient-btn" id="amb-rain"><i class="fa-solid fa-cloud-showers-heavy"></i> Rain</button>
                    <button class="ambient-btn" id="amb-waves"><i class="fa-solid fa-water"></i> Ocean</button>
                    <button class="ambient-btn" id="amb-fire"><i class="fa-solid fa-fire"></i> Vinyl Crackle</button>
                </div>
            </header>

            <!-- Center Display Stage -->
            <section class="stage-container">
                <canvas id="main-visualizer"></canvas>

                <div class="track-header-overlay">
                    <div class="track-badge">FLAC / HIGH-RES AUDIO</div>
                    <h1 class="track-title-main" id="track-title">Siap Memutar Studio Audio</h1>
                    <p class="track-artist-main" id="track-artist">Silakan impor berkas dari perangkat Anda</p>
                </div>
            </section>

            <!-- Master Control Dock -->
            <section class="control-dock">
                <!-- Timeline Seeking -->
                <div class="seek-bar-container">
                    <span class="time-code" id="time-current">00:00.0</span>
                    <div class="seek-track" id="seek-track">
                        <div class="seek-progress" id="seek-progress"></div>
                    </div>
                    <span class="time-code" id="time-total">00:00.0</span>
                </div>

                <div class="dock-controls">
                    <!-- Left Utility Controls -->
                    <div class="dock-group">
                        <button class="tool-btn" id="btn-loop-ab" title="Fitur Unik: A-B Seamless Loop Marker">
                            <i class="fa-solid fa-repeat"></i> <span class="badge-text">A-B</span>
                        </button>
                        <button class="tool-btn" id="btn-pitch-down" title="Pitch Shift Slow"><i class="fa-solid fa-gauge-simple-min"></i> -</button>
                        <span class="pitch-readout" id="pitch-readout">1.00x</span>
                        <button class="tool-btn" id="btn-pitch-up" title="Pitch Shift Speed"><i class="fa-solid fa-gauge-simple-high"></i> +</button>
                    </div>

                    <!-- Center Transport Playback Controls -->
                    <div class="dock-group transport-group">
                        <button class="transport-btn" id="btn-prev"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="transport-btn play-main" id="btn-play"><i class="fa-solid fa-play"></i></button>
                        <button class="transport-btn" id="btn-next"><i class="fa-solid fa-forward-step"></i></button>
                    </div>

                    <!-- Right Audio Monitoring Controls -->
                    <div class="dock-group">
                        <i class="fa-solid fa-volume-high volume-icon"></i>
                        <input type="range" class="master-volume" id="master-volume" min="0" max="1" step="0.01" value="0.85">
                    </div>
                </div>
            </section>

        </main>

        <!-- Right Drawer: Playlist & Smart Queue -->
        <aside class="playlist-drawer">
            <div class="drawer-header">
                <h3>DAFTAR PUTAR STUDIO</h3>
                <span class="track-count" id="track-count">0 Track</span>
            </div>

            <div class="playlist-scroll" id="playlist-container">
                <!-- Dynamic Items Generated by JavaScript -->
            </div>
        </aside>
    </div>

    <audio id="audio-core"></audio>

    <!-- Application Architecture Modules -->
    <script src="audio-engine.js"></script>
    <script src="visualizer.js"></script>
    <script src="app.js"></script>
    
</body>
    </html>
