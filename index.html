<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Music Player - Frost Blossom Edition</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Background & Visualizer Canvas -->
    <div class="bg-container" id="bg-art"></div>
    <canvas id="visualizer"></canvas>

    <!-- App Card Container -->
    <div class="player-card">
        
        <!-- Left Section: Clock & Artwork -->
        <div class="left-panel">
            <div class="clock-box">
                <div class="clock-time" id="clock-time">00:00:00</div>
                <div class="clock-date" id="clock-date">SENIN, 1 JANUARI 2026</div>
            </div>

            <div class="album-art-wrapper" id="art-wrapper">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500" alt="Album Cover" class="album-art" id="album-cover">
            </div>

            <div style="font-size: 0.75rem; opacity: 0.7; text-align: center;">
                <i class="fa-solid fa-compact-disc"></i> Anime Audio Engine v2.0
            </div>
        </div>

        <!-- Right Section: Player & Playlist Controls -->
        <div class="right-panel">
            <div class="header-actions">
                <label for="file-input" class="upload-btn">
                    <i class="fa-solid fa-folder-plus"></i> Tambah Lagu
                </label>
                <input type="file" id="file-input" accept="audio/*" multiple>
                <span style="font-size: 0.8rem; color: var(--accent);"><i class="fa-solid fa-music"></i> Local Player</span>
            </div>

            <div class="song-info">
                <div class="song-title" id="track-title">Pilih atau Upload Lagu...</div>
                <div class="song-artist" id="track-artist">Anime Music Player</div>
            </div>

            <!-- Track Progress -->
            <div class="progress-container">
                <div class="progress-bar-bg" id="progress-bg">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-stamps">
                    <span id="curr-time">00:00</span>
                    <span id="dur-time">00:00</span>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="controls">
                <button class="btn-control" id="btn-shuffle"><i class="fa-solid fa-shuffle"></i></button>
                <button class="btn-control" id="btn-prev"><i class="fa-solid fa-backward-step"></i></button>
                <button class="btn-control btn-play" id="btn-play"><i class="fa-solid fa-play"></i></button>
                <button class="btn-control" id="btn-next"><i class="fa-solid fa-forward-step"></i></button>
                <button class="btn-control" id="btn-repeat"><i class="fa-solid fa-repeat"></i></button>
            </div>

            <!-- Volume Control -->
            <div class="volume-container">
                <i class="fa-solid fa-volume-high" id="vol-icon" style="font-size: 0.9rem;"></i>
                <input type="range" class="volume-slider" id="vol-slider" min="0" max="1" step="0.01" value="0.8">
            </div>

            <!-- Interactive Playlist -->
            <div class="playlist-wrapper" id="playlist">
                <!-- Playlist Item akan di-generate via JavaScript -->
            </div>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <!-- Custom JavaScript File -->
    <script src="script.js"></script>
</body>
                </html>
